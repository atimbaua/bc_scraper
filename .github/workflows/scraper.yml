name: Bandcamp Ambient Bot Parser

on:
  schedule:
    - cron: '0 */2 * * *'  # Запуск каждые 2 часа
  workflow_dispatch:       # Возможность запуска вручную кнопкой

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Чтение кода репозитория
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка зависимостей
        run: |
          pip install requests beautifulsoup4

      - name: Запуск автопостинга
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_scraper.py

      - name: Сохранение истории опубликованного
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add posted_releases.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update posted releases" && git push)
