name: Bandcamp Telegram Scraper Bot

on:
  schedule:
    # Запуск каждый час на 30-й минуте (например, 12:30, 13:30, 14:30 UTC)
    - cron: '30 * * * *'
  workflow_dispatch:       # Возможность запуска вручную

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Чтение кода репозитория
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка зависимостей
        run: |
            pip install requests beautifulsoup4 curl_cffi
            pip install git+https://github.com/LeMetadatarr/py_bandcamp.git

      - name: Запуск автопостинга
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: python bot_scraper.py

      - name: Сохранение истории опубликованного и метрик
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add posted_releases.json releases_data.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update posted releases and CSV analytics" && git push)
