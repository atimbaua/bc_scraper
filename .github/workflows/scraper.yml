name: Bandcamp Ambient Bot Parser

on:
  schedule:
    # Запуск каждые 4 часа (в 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 по UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Оставляем кнопку для ручной проверки при необходимости

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Чтение кода репозитория
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка зависимостей
        run: |
          pip install requests beautifulsoup4 curl_cffi

      - name: Запуск автопостинга
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: python bot_scraper.py

      - name: Сохранение истории опубликованного и метрик
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add posted_releases.json releases_data.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update posted releases and CSV analytics" && git push)
